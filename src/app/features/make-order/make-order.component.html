<section class="make-order" aria-labelledby="title-main">
  <h2 id="title-main" class="make-order__title-main visually-hidden">Сделать заказ</h2>
  <div class="make-order__content container">
    <h3 class="make-order__title-content">Чтобы сделать заказ, укажите ваш телефон</h3>
    <div class="make-order__info">Мы перезвоним в течении 15 минут, чтобы уточнить ваши пожелания</div>
    <form class="make-order__form">
      <div class="make-order__wrapper-form">
          <label for="phone" class="visually-hidden">Номер телефона</label>
        <input id="phone" class="make-order__phone" type="tel" inputmode="tel" placeholder="Номер телефона">
          <button class="make-order__submit" type="submit">Сделать заказ</button>
      </div>
        <label class="make-order__agreement">
            <input id="agreement" type="checkbox">
            <span class="make-order__checkmark" aria-hidden="true"></span>
            Нажамая на кнопку, вы соглашаетесь с условиями обработки персональных данных</label>
    </form>
  </div>
</section>
